run_mode: replay                 # live | record | replay   (env RUN_MODE overrides)
# Free-tier models only, newest first. Per ai.google.dev/gemini-api/docs/pricing (2026-10-15).
models:
  router: [gemini-3.5-flash-lite, gemini-3.1-flash-lite, gemini-2.5-flash-lite]
  writer: [gemini-3.8-flash, gemini-3.6-flash, gemini-3.5-flash-lite, gemini-2.5-flash]
temperature: {router: 0.0, writer: 0.2}
max_output_tokens: {router: 256, writer: 1024}
thinking_level: {router: MINIMAL, writer: LOW}   # Gemini 3: MINIMAL|LOW|MEDIUM|HIGH; Gemini 2.5: token budget (0 = off)
router: {low_confidence_threshold: 0.6}
rate_limits:                     # conservative placeholders, below free-tier limits
  default_rpm: 8
  max_concurrency: 2
retry: {max_attempts: 2, base_seconds: 2.0, cap_seconds: 10.0, max_wait_seconds: 30}   # fail fast to the next model
timeout_seconds: 30
paths: {cassettes: cassettes}
demo_now: 2026-10-14T10:30:00          # fixed clock for the fictional data (status freshness)
stale_after_minutes: 60               # policies/install-repair.md#updates
